server.port=8092

spring.application.name=notification-service

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/notification_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (shared secret — same as all services)
jwt.secret=3j9k2m5n8p1q7w3x9z2a4b6c8d0e2f4g6h8i0j2k4l6m8n0p2q4r6s8t0u2v4w6x8y0z2
jwt.expiration=86400000

# Internal API key (for inter-service calls)
internal.api.key=PHARMACY_INTERNAL_KEY_2024

# Logging
logging.level.com.pharmacy.notification_service=DEBUG

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs

server.port=8091

spring.application.name=reporting-service

# MySQL - đọc dữ liệu từ reporting_db (pre-aggregated snapshots)
spring.datasource.url=jdbc:mysql://localhost:3306/reporting_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (shared secret)
jwt.secret=3j9k2m5n8p1q7w3x9z2a4b6c8d0e2f4g6h8i0j2k4l6m8n0p2q4r6s8t0u2v4w6x8y0z2
jwt.expiration=86400000
# Downstream service URLs (để pull data)
sales.service.url=http://localhost:8085
inventory.service.url=http://localhost:8083
purchase.service.url=http://localhost:8086
catalog.service.url=http://localhost:8087

# Logging
logging.level.com.pharmacy.reporting_service=DEBUG

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs
